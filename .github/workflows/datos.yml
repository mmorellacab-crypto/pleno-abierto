# Actualiza los datos cada semana (y cuando lo lances a mano desde la pestaña Actions).
# Descarga los votos oficiales del Congreso y la lista de leyes/temas de El Congreso en tu mano,
# genera docs/data/dataset.json y lo publica en GitHub Pages (carpeta docs/).
name: Actualizar datos

on:
  schedule:
    - cron: '17 5 * * *' # cada día a las 05:17 UTC
    - cron: '47 20 * * 2-4' # martes a jueves por la noche (días habituales de Pleno)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Generar dataset
        run: node pipeline/build.mjs
      - name: Comprobar dataset
        run: node --test pipeline/test.mjs pipeline/test-build.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/cache
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos actualizados $(date -u +%Y-%m-%d)"
            git push
          fi
