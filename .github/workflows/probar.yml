name: Probar arranque

# Abre el APK en un emulador Android y comprueba que la app no se cierra.
on:
  workflow_call:
    inputs:
      run-id:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      run-id:
        description: "ID de la ejecución de «Compilar Android» cuyo APK se prueba"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pleno-abierto-android
          path: salida
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Arrancar la app en un emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/probar-arranque.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registro-emulador
          path: logcat.txt
          retention-days: 7
