name: Probar arranque

# Abre el APK en un emulador Android y comprueba que la app no se cierra.
on:
  workflow_call:
    inputs:
      run-id:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      run-id:
        description: "ID de la ejecución de «Compilar Android» cuyo APK se prueba"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pleno-abierto-android
          path: salida
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Arrancar la app en un emulador
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/probar-arranque.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: registro-emulador
          path: logcat.txt
          retention-days: 7
