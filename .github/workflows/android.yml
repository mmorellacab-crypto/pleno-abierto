# Compila la app Android en la nube de GitHub (gratis para repositorios públicos).
# - Al subir cambios a main: genera un APK de prueba que puedes descargar desde la pestaña Actions.
# - Al crear una etiqueta v1.0.0, v1.0.1…: publica el APK y el AAB (para Google Play) en Releases.
# Firma: si existen los secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD y ANDROID_KEY_ALIAS
# se firma con tu clave; si no, el APK queda firmado con una clave de depuración (válido para probar,
# no para Google Play).
name: Compilar Android

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
    tags: ['v*']
  workflow_dispatch:

# Permisos mínimos por defecto; cada trabajo pide solo lo que necesita.
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # solo se usa para publicar versiones (etiquetas v*)
      id-token: write # certificado de procedencia de la compilación
      attestations: write
    env:
      # Huella SHA-256 del certificado de firma oficial de Pleno Abierto.
      # Si un APK firmado no coincide con esta huella, la compilación falla.
      HUELLA_FIRMA: 5c5de608470213e106884c783d0163a19946bc46543c5ffedc9a0c2863f0ce50
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_REPO_URL: https://github.com/${{ github.repository }}
      EXPO_PUBLIC_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      EXPO_PUBLIC_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/dataset.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      - name: Comprobar tipos
        working-directory: app
        run: npx tsc --noEmit

      - name: Validar el test Brújula
        working-directory: app
        run: npm run validar-test

      - name: Copiar los datos más recientes a la app
        run: |
          cp docs/data/dataset.json app/assets/dataset.json
          if [ -f docs/data/diputados.json ]; then cp docs/data/diputados.json app/assets/diputados.json; fi

      - name: Generar proyecto Android
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK y AAB
        working-directory: app/android
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Firmar con tu clave (si está configurada)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p salida
          APK=app/android/app/build/outputs/apk/release/app-release.apk
          AAB=app/android/app/build/outputs/bundle/release/app-release.aab
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > clave.jks
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f 4 "$APK" salida/alineado.apk
            "$BT/apksigner" sign --ks clave.jks --ks-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" --out salida/pleno-abierto.apk salida/alineado.apk
            rm salida/alineado.apk
            cp "$AAB" salida/pleno-abierto.aab
            jarsigner -keystore clave.jks -storepass "$KS_PASS" salida/pleno-abierto.aab "$KS_ALIAS"
            rm clave.jks
            HUELLA=$("$BT/apksigner" verify --print-certs salida/pleno-abierto.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
            echo "Huella del certificado: $HUELLA"
            if [ "$HUELLA" != "$HUELLA_FIRMA" ]; then
              echo "::error::El APK no está firmado con la clave oficial de Pleno Abierto."
              exit 1
            fi
          else
            echo "::warning::Sin clave de firma: APK firmado con clave de depuración (solo para pruebas)."
            cp "$APK" salida/pleno-abierto-prueba.apk
          fi
          (cd salida && sha256sum * > SHA256SUMS.txt)
          ls -la salida
          cat salida/SHA256SUMS.txt

      - name: Certificado de procedencia (quién y cómo se compiló)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: salida/pleno-abierto*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pleno-abierto-android
          path: salida/
          retention-days: 30

      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: salida/*
          body: |
            App Android de Pleno Abierto. Descarga el fichero .apk en tu móvil para instalarla.
            Datos: Congreso de los Diputados (datos abiertos) y El Congreso en tu mano (CC BY 4.0).

  # Prueba de arranque: instala el APK en un emulador Android, lo abre y comprueba que no se cierra.
  probar:
    needs: android
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/probar.yml
    with:
      run-id: ${{ github.run_id }}
